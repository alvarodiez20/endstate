[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endstate"
# Single source of truth is __init__.py, read by hatchling below. Release
# automation edits one file; a second copy here would drift the first time a
# bump landed in only one of them.
dynamic = ["version"]
description = "An agent harness with evals that grade the end state, not the output."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Álvaro Diez de Pablos", email = "alvarodiez20@gmail.com" }]
keywords = ["ai-agents", "llm", "evaluation", "llmops", "agent-harness"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
all = ["endstate[anthropic,openai]"]

[project.urls]
Homepage = "https://github.com/alvarodiez20/endstate"
Repository = "https://github.com/alvarodiez20/endstate"
Issues = "https://github.com/alvarodiez20/endstate/issues"

[project.scripts]
endstate = "endstate.cli:app"

[dependency-groups]
# ruff is pinned to a minor series: its formatter output is version-dependent,
# and `ruff format --check` is a blocking gate. An unbounded range means CI can
# go red on a day nobody touched the repo.
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.16.2,<0.17", "mypy>=1.11"]
# Docs build with --strict in CI, where a new minor of either package can turn a
# warning into a build failure. Pinned for the same reason as ruff.
docs = [
  "mkdocs>=1.6,<2.0",
  "mkdocs-material>=9.5,<10.0",
  "mkdocstrings[python]>=0.26,<1.0",
]

[tool.hatch.version]
path = "src/endstate/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/endstate"]

[tool.semantic_release]
# Conventional Commits decide the bump: feat -> minor, fix/perf -> patch,
# `!` or a BREAKING CHANGE footer -> major. Anything else produces no release,
# so docs and chore commits land on main without consuming a version.
version_variables = ["src/endstate/__init__.py:__version__"]
tag_format = "v{version}"
commit_message = "chore(release): v{version} [skip ci]"
# Nothing is built here. The GitHub Release is the deliverable; publishing to
# PyPI is a separate, deliberate act — see .github/workflows/release.yml.
build_command = ""
# Pre-1.0, a breaking change bumps the minor rather than jumping to 1.0.0.
# v1.0.0 is a decision this project makes on purpose, not one a `feat!:` makes.
major_on_zero = false
allow_zero_version = true

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.changelog]
exclude_commit_patterns = ["^chore\\(release\\):"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Markdown is prose, not source. ruff >= 0.16 reformats Python fenced in .md,
# which turns illustrative snippets in PLAN.md into a failing format gate.
#
# `tasks/` is task material, not this project's code. The fixtures contain
# deliberate bugs — a mutable default argument, an off-by-one — that are the
# thing being graded, and a linter that fixes them deletes the task.
extend-exclude = ["*.md", "tasks/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# typer expresses CLI options as call-valued defaults; that is the framework contract.
"src/endstate/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/endstate"]

[[tool.mypy.overrides]]
# Provider SDKs are optional extras; the base dev env does not install them.
module = ["openai.*", "anthropic.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/endstate"]
omit = [
  # Network adapters: exercised by integration runs, not unit tests. Excluded so
  # the coverage gate measures logic that is actually testable offline.
  "src/endstate/providers/anthropic.py",
  "src/endstate/providers/openai_compat.py",
  "src/endstate/cli.py",
]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if TYPE_CHECKING:", "\\.\\.\\."]
