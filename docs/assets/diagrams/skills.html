<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
// Serve React from this site rather than unpkg: the docs must not depend on a
// third-party CDN at page-view time. support.js honours __resources as an
// override for its pinned CDN URLs (the files are byte-identical to the ones
// its SRI hashes cover).
window.__resources = {
  "https://unpkg.com/react@18.3.1/umd/react.production.min.js": "./vendor/react-18.3.1.production.min.js",
  "https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js": "./vendor/react-dom-18.3.1.production.min.js"
};
</script>
<script src="./support.js"></script>
<script>
// Follow the Material palette toggle in the parent page; fall back to the system setting.
(function () {
  var current = null;
  function apply(scheme) {
    if (scheme !== "light" && scheme !== "dark") return;
    current = scheme;
    // Both elements: the stylesheet sets color-scheme on html *and* body, and
    // light-dark() inside the body resolves against the body's own value.
    document.documentElement.style.colorScheme = scheme;
    if (document.body) document.body.style.colorScheme = scheme;
  }
  addEventListener("DOMContentLoaded", function () {
    if (current) apply(current);
  });
  var q = new URLSearchParams(location.search).get("theme");
  if (q) apply(q);
  addEventListener("message", function (e) {
    if (e.data && e.data.type === "endstate-theme") apply(e.data.scheme);
  });
  addEventListener("load", function () {
    if (parent !== window) parent.postMessage({ type: "endstate-diagram-ready" }, "*");
  });
})();
</script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="crossorigin">
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700%7CRoboto+Mono:400,500,700&display=swap">
<style>
  html, body { margin: 0; padding: 0; color-scheme: light dark; background: light-dark(#ffffff, #0d0d0d); }
  a { color: light-dark(#0f766e, #5eead4); }
  a:hover { color: light-dark(#0b5c56, #99f6e4); }
</style>
</helmet>
<div style="font-family: Roboto, Helvetica, Arial, sans-serif; color: light-dark(#0d0d0d, #e9e9e9); background: light-dark(#ffffff, #0d0d0d); padding: 28px 32px 24px; display: flex; flex-direction: column; gap: 18px; box-sizing: border-box">

  <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 24px; flex-wrap: wrap">
    <div style="display: flex; align-items: baseline; gap: 14px">
      <div style="font-size: 19px; font-weight: 500; letter-spacing: -.01em">Skills</div>
      <div style="font-family: 'Roboto Mono', monospace; font-size: 12px; color: light-dark(#6b6b6b, #9a9a9a)">progressive disclosure</div>
    </div>
    <div style="font-family: 'Roboto Mono', monospace; font-size: 12px; transition: color .35s ease; color: {{ statusFg }}">{{ status }}</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{ levels }}" as="l" hint-placeholder-count="3">
      <div style="display: grid; grid-template-columns: 30px minmax(0, 1fr) 132px; gap: 14px; align-items: center; border: 1px solid; border-radius: 3px; padding: 11px 13px; transition: all .45s ease; border-color: {{ l.line }}; background: {{ l.bg }}; opacity: {{ l.op }}">
        <div style="font-family: 'Roboto Mono', monospace; font-size: 15px; font-weight: 500; color: {{ l.fg }}">{{ l.n }}</div>
        <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
          <div style="font-family: 'Roboto Mono', monospace; font-size: 12px; font-weight: 500; color: {{ l.fg }}">{{ l.what }}</div>
          <div style="font-size: 11px; color: light-dark(#6b6b6b, #9a9a9a)">{{ l.when }}</div>
        </div>
        <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 5px">
          <div style="font-family: 'Roboto Mono', monospace; font-size: 11.5px; transition: color .45s ease; color: {{ l.costFg }}">{{ l.cost }}</div>
          <div style="width: 100%; height: 5px; border-radius: 1px; background: light-dark(#f0f0f0, #1c1c1c); overflow: hidden">
            <div style="height: 100%; transition: width .7s cubic-bezier(.4,0,.2,1), background .45s ease; width: {{ l.w }}; background: {{ l.bar }}"></div>
          </div>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 18px; align-items: start">
    <div style="border: 1px solid light-dark(#e6e6e6, #262626); border-radius: 3px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px">
      <div style="font-family: 'Roboto Mono', monospace; font-size: 11.5px; font-weight: 500">pdf-processing/</div>
      <div style="font-family: 'Roboto Mono', monospace; font-size: 11px; line-height: 1.7; color: light-dark(#6b6b6b, #9a9a9a)">├── SKILL.md<br>├── scripts/<br>├── references/<br>└── assets/</div>
      <div style="font-family: 'Roboto Mono', monospace; font-size: 10px; line-height: 1.5; color: light-dark(#8a8a8a, #6b6b6b); border-top: 1px solid light-dark(#ececec, #242424); padding-top: 7px; margin-top: 2px">two required fields and a<br>markdown body. that is the<br>whole format.</div>
    </div>

    <div style="border: 1px solid; border-radius: 3px; padding: 13px 15px; display: flex; flex-direction: column; gap: 8px; min-height: 138px; transition: all .4s ease; border-color: {{ panel.line }}; background: {{ panel.bg }}">
      <div style="font-family: 'Roboto Mono', monospace; font-size: 12px; font-weight: 500; color: {{ panel.fg }}">{{ panelTitle }}</div>
      <div style="font-family: 'Roboto Mono', monospace; font-size: 11.5px; line-height: 1.6; white-space: pre-line; color: light-dark(#3d3d3d, #b5b5b5)">{{ panelBody }}</div>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 28px; align-items: end; border-top: 1px solid light-dark(#e6e6e6, #262626); padding-top: 16px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-family: 'Roboto Mono', monospace; font-size: 12px; color: light-dark(#0f766e, #5eead4)">{{ line }}</div>
      <div style="font-size: 13.5px; line-height: 1.5; min-height: 42px; max-width: 78ch; color: light-dark(#3d3d3d, #b5b5b5); text-wrap: pretty">{{ caption }}</div>
    </div>
    <div style="display: flex; align-items: center; gap: 8px">
      <button onClick="{{ prev }}" style="font-family: 'Roboto Mono', monospace; font-size: 12px; padding: 6px 11px; border: 1px solid light-dark(#d4d4d4, #333); background: transparent; color: light-dark(#0d0d0d, #e9e9e9); border-radius: 3px; cursor: pointer" style-hover="border-color: light-dark(#0f766e, #5eead4)">←</button>
      <button onClick="{{ toggle }}" style="font-family: 'Roboto Mono', monospace; font-size: 12px; padding: 6px 13px; border: 1px solid light-dark(#d4d4d4, #333); background: transparent; color: light-dark(#0d0d0d, #e9e9e9); border-radius: 3px; cursor: pointer; min-width: 62px" style-hover="border-color: light-dark(#0f766e, #5eead4)">{{ playLabel }}</button>
      <button onClick="{{ next }}" style="font-family: 'Roboto Mono', monospace; font-size: 12px; padding: 6px 11px; border: 1px solid light-dark(#d4d4d4, #333); background: transparent; color: light-dark(#0d0d0d, #e9e9e9); border-radius: 3px; cursor: pointer" style-hover="border-color: light-dark(#0f766e, #5eead4)">→</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:840,&quot;height&quot;:620}}">
const ON = "light-dark(#0f766e, #5eead4)";
const BAD = "light-dark(#b3261e, #ff8a80)";
const OFF_LINE = "light-dark(#e6e6e6, #262626)";
const OFF_FG = "light-dark(#3d3d3d, #b5b5b5)";

const LEVELS = [
  { n: "1", what: "name + description of every installed skill", when: "at startup, always", cost: "~100 tokens each", w: "8%" },
  { n: "2", what: "the full SKILL.md body", when: "when the agent decides the skill applies", cost: "<5_000 tokens", w: "38%" },
  { n: "3", what: "references/ · scripts/ · assets/", when: "only the specific file the task needs", cost: "unbounded", w: "100%" },
];

const S = [
  { active: -1, bad: true, status: "the problem",
    title: "the system prompt grows",
    body: "eleven-step deployment procedure  → system prompt\nthe next procedure               → system prompt\nthe third                        → system prompt\n\n9_000 tokens read in full before answering\n\u201cwhat time is it\u201d — and the ones that matter are\nburied in the middle where attention is worst.",
    line: "# a tool description is billed on every step of every run",
    caption: "Including the ten thousand runs that have nothing to do with deployment. Every fix for this is a variant of the same idea: load the instructions only when they are relevant." },
  { active: 0, status: "level 1 · the table of contents",
    title: "loaded at startup, always",
    body: "name: pdf-processing\ndescription: Extracts text and tables from PDF files...\n\na hundred skills cost ten thousand tokens of\nalways-on context.",
    line: "~100 tokens per skill, fixed",
    caption: "Level 1 is a table of contents. It is the only thing the model sees when deciding whether a skill is relevant." },
  { active: 0, bad: true, status: "the description IS the router",
    title: "a classifier prompt with a 1024-character budget",
    body: "# Poor — the model has no idea when this applies\ndescription: Helps with PDFs.\n\n# Good — says what it does AND when to reach for it\ndescription: Extracts text and tables from PDF files,\n  fills PDF forms, and merges multiple PDFs. Use when\n  working with PDF documents or when the user mentions\n  PDFs, forms, or document extraction.",
    line: "# the failure mode of a vague description is not an error",
    caption: "It is a skill that silently never fires, and an agent that keeps solving the problem the hard way while you wonder why the skill you wrote made no difference." },
  { active: 1, status: "level 2 · the chapter",
    title: "read when the agent decides it applies",
    body: "the full SKILL.md body, recommended under 5_000 tokens\n\nno new harness code: this is a read call against the\nfile tools the agent already has.",
    line: "read({\"path\": \"skills/pdf-processing/SKILL.md\"})",
    caption: "Level 2 is a chapter. It costs nothing on the runs where the skill never fires." },
  { active: 2, status: "level 3 · the appendix",
    title: "only the specific file the task needs",
    body: "references/  loaded on demand, unbounded\nscripts/     run, not read — the input never\n             enters the context window\nassets/      templates, schemas, data",
    line: "# the knowledge you can attach is unbounded; the fixed cost is not",
    caption: "Because levels 2 and 3 are read with the agent's own tools from its own filesystem, a hundred skills give access to arbitrarily many megabytes of instruction at a hundred tokens each." },
  { active: -1, status: "why skills carry code",
    title: "a correctness feature, not a convenience one",
    body: "sorting a list by generating tokens is expensive and\noccasionally wrong. sorting a list by calling sorted()\nis neither.",
    line: "# prefer the mechanism that is checkable over the one that is usually right",
    caption: "Anywhere a task has a deterministic answer, running code beats predicting it — the same argument as grading the end state rather than the transcript." },
  { active: -1, bad: true, status: "the supply chain",
    title: "instructions and code, from a third party,\nthat your agent will read and follow",
    body: "a malicious SKILL.md does not need an exploit.\nit needs the model to do what the file says,\nwhich is the file's entire purpose.",
    line: "# audit bundled scripts, dependencies, and anything reaching the network",
    caption: "Advice is not a control. The controls are deny-by-default in the harness, which a skill cannot talk its way around, and a sandbox that bounds the damage." },
  { active: -1, status: "tool · MCP · skill",
    title: "three different things",
    body: "tool         a verb the harness can execute\n             — its schema, on every call\nMCP server   where verbs come from at runtime\n             — its schemas, on every call\nskill        instructions for using the verbs you have\n             — ~100 tokens when idle",
    line: "# a skill adds judgement about existing capability, not capability",
    caption: "If this harness grew skills, level 1 would be system prompt assembly and levels 2–3 would need no new code — which is why they are cheap to adopt and expensive to secure." },
];

class Component extends DCLogic {
  state = { i: 0, playing: !matchMedia("(prefers-reduced-motion: reduce)").matches };
  componentDidMount() { this.tick(); }
  componentWillUnmount() { clearInterval(this.timer); }
  tick() {
    clearInterval(this.timer);
    if (!this.state.playing) return;
    this.timer = setInterval(() => this.setState(s => ({ i: (s.i + 1) % S.length })), 3600);
  }
  go(d) { this.setState(s => ({ i: (s.i + d + S.length) % S.length, playing: false }), () => this.tick()); }
  renderVals() {
    const s = S[this.state.i];
    return {
      status: s.status,
      statusFg: s.bad ? BAD : "light-dark(#6b6b6b, #9a9a9a)",
      levels: LEVELS.map((l, idx) => {
        const on = s.active === idx;
        const shown = s.active >= idx;
        return {
          n: l.n, what: l.what, when: l.when, cost: l.cost,
          w: shown ? l.w : "0%",
          line: on ? ON : OFF_LINE,
          bg: on ? "light-dark(#f0faf8, #10201f)" : "transparent",
          fg: on ? ON : OFF_FG,
          costFg: on ? ON : "light-dark(#8a8a8a, #6b6b6b)",
          bar: on ? ON : "light-dark(#d8d8d8, #303030)",
          op: s.active === -1 ? 0.55 : (on ? 1 : 0.5),
        };
      }),
      panel: { line: s.bad ? BAD : ON, bg: s.bad ? "light-dark(#fdf3f2, #1f1211)" : "light-dark(#f0faf8, #10201f)", fg: s.bad ? BAD : ON },
      panelTitle: s.title,
      panelBody: s.body,
      line: s.line,
      caption: s.caption,
      playLabel: this.state.playing ? "pause" : "play",
      prev: () => this.go(-1),
      next: () => this.go(1),
      toggle: () => this.setState(s2 => ({ playing: !s2.playing }), () => this.tick()),
    };
  }
}
</script>
</body>
</html>
