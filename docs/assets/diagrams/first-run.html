<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
// Serve React from this site rather than unpkg: the docs must not depend on a
// third-party CDN at page-view time. support.js honours __resources as an
// override for its pinned CDN URLs (the files are byte-identical to the ones
// its SRI hashes cover).
window.__resources = {
  "https://unpkg.com/react@18.3.1/umd/react.production.min.js": "./vendor/react-18.3.1.production.min.js",
  "https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js": "./vendor/react-dom-18.3.1.production.min.js"
};
</script>
<script src="./support.js"></script>
<script>
// Follow the Material palette toggle in the parent page; fall back to the system setting.
(function () {
  var current = null;
  function apply(scheme) {
    if (scheme !== "light" && scheme !== "dark") return;
    current = scheme;
    // Both elements: the stylesheet sets color-scheme on html *and* body, and
    // light-dark() inside the body resolves against the body's own value.
    document.documentElement.style.colorScheme = scheme;
    if (document.body) document.body.style.colorScheme = scheme;
  }
  addEventListener("DOMContentLoaded", function () {
    if (current) apply(current);
  });
  var q = new URLSearchParams(location.search).get("theme");
  if (q) apply(q);
  addEventListener("message", function (e) {
    if (e.data && e.data.type === "endstate-theme") apply(e.data.scheme);
  });
  addEventListener("load", function () {
    if (parent !== window) parent.postMessage({ type: "endstate-diagram-ready" }, "*");
  });
})();
</script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="crossorigin">
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700%7CRoboto+Mono:400,500,700&display=swap">
<style>
  html, body { margin: 0; padding: 0; color-scheme: light dark; background: light-dark(#ffffff, #0d0d0d); }
  a { color: light-dark(#0f766e, #5eead4); }
  a:hover { color: light-dark(#0b5c56, #99f6e4); }
</style>
</helmet>
<div style="font-family: Roboto, Helvetica, Arial, sans-serif; color: light-dark(#0d0d0d, #e9e9e9); background: light-dark(#ffffff, #0d0d0d); padding: 28px 32px 24px; display: flex; flex-direction: column; gap: 18px; box-sizing: border-box">

  <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 24px; flex-wrap: wrap">
    <div style="display: flex; align-items: baseline; gap: 14px">
      <div style="font-size: 19px; font-weight: 500; letter-spacing: -.01em">Your first run</div>
      <div style="font-family: 'Roboto Mono', monospace; font-size: 12px; color: light-dark(#6b6b6b, #9a9a9a)">endstate run</div>
    </div>
    <div style="font-family: 'Roboto Mono', monospace; font-size: 12px; transition: color .35s ease; color: {{ statusFg }}">{{ status }}</div>
  </div>

  <div style="border: 1px solid; border-radius: 3px; padding: 10px 13px; font-family: 'Roboto Mono', monospace; font-size: 12px; transition: all .4s ease; border-color: {{ cmd.line }}; background: {{ cmd.bg }}; color: {{ cmd.fg }}; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{ cmdText }}</div>

  <div style="display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 18px; align-items: start">

    <div style="border: 1px solid light-dark(#e6e6e6, #262626); border-radius: 3px; overflow: hidden">
      <div style="font-family: 'Roboto Mono', monospace; font-size: 10.5px; padding: 7px 12px; border-bottom: 1px solid light-dark(#ececec, #242424); color: light-dark(#8a8a8a, #6b6b6b)">run</div>
      <div style="padding: 4px 0">
        <sc-for list="{{ rows }}" as="r" hint-placeholder-count="7">
          <div style="display: grid; grid-template-columns: 118px minmax(0, 1fr); gap: 12px; align-items: baseline; padding: 5px 12px; font-family: 'Roboto Mono', monospace; font-size: 11.5px; transition: background .4s ease; background: {{ r.bg }}">
            <div style="color: light-dark(#8a8a8a, #6b6b6b)">{{ r.k }}</div>
            <div style="font-weight: 500; transition: color .4s ease; color: {{ r.fg }}">{{ r.v }}</div>
          </div>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px">
      <div style="border: 1px solid; border-radius: 3px; padding: 13px 15px; display: flex; flex-direction: column; gap: 8px; min-height: 122px; transition: all .4s ease; border-color: {{ panel.line }}; background: {{ panel.bg }}">
        <div style="font-family: 'Roboto Mono', monospace; font-size: 12px; font-weight: 500; color: {{ panel.fg }}">{{ panelTitle }}</div>
        <div style="font-family: 'Roboto Mono', monospace; font-size: 11.5px; line-height: 1.6; white-space: pre-line; color: light-dark(#3d3d3d, #b5b5b5)">{{ panelBody }}</div>
      </div>

      <div style="display: flex; align-items: stretch; gap: 12px; transition: opacity .4s ease; opacity: {{ truthOp }}">
        <div style="flex: 1; border: 1px solid light-dark(#e6e6e6, #262626); border-radius: 3px; padding: 10px 12px">
          <div style="font-family: 'Roboto Mono', monospace; font-size: 10px; color: light-dark(#8a8a8a, #6b6b6b)">the table tells you</div>
          <div style="font-family: 'Roboto Mono', monospace; font-size: 11.5px; margin-top: 4px; color: light-dark(#3d3d3d, #b5b5b5)">what the run cost</div>
        </div>
        <div style="flex: 1; border: 1px solid; border-radius: 3px; padding: 10px 12px; transition: all .4s ease; border-color: {{ truth.line }}; background: {{ truth.bg }}">
          <div style="font-family: 'Roboto Mono', monospace; font-size: 10px; color: light-dark(#8a8a8a, #6b6b6b)">the filesystem tells you</div>
          <div style="font-family: 'Roboto Mono', monospace; font-size: 11.5px; margin-top: 4px; transition: color .4s ease; color: {{ truth.fg }}">whether it worked</div>
        </div>
      </div>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 28px; align-items: end; border-top: 1px solid light-dark(#e6e6e6, #262626); padding-top: 16px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-family: 'Roboto Mono', monospace; font-size: 12px; color: light-dark(#0f766e, #5eead4)">{{ line }}</div>
      <div style="font-size: 13.5px; line-height: 1.5; min-height: 42px; max-width: 78ch; color: light-dark(#3d3d3d, #b5b5b5); text-wrap: pretty">{{ caption }}</div>
    </div>
    <div style="display: flex; align-items: center; gap: 8px">
      <button onClick="{{ prev }}" style="font-family: 'Roboto Mono', monospace; font-size: 12px; padding: 6px 11px; border: 1px solid light-dark(#d4d4d4, #333); background: transparent; color: light-dark(#0d0d0d, #e9e9e9); border-radius: 3px; cursor: pointer" style-hover="border-color: light-dark(#0f766e, #5eead4)">←</button>
      <button onClick="{{ toggle }}" style="font-family: 'Roboto Mono', monospace; font-size: 12px; padding: 6px 13px; border: 1px solid light-dark(#d4d4d4, #333); background: transparent; color: light-dark(#0d0d0d, #e9e9e9); border-radius: 3px; cursor: pointer; min-width: 62px" style-hover="border-color: light-dark(#0f766e, #5eead4)">{{ playLabel }}</button>
      <button onClick="{{ next }}" style="font-family: 'Roboto Mono', monospace; font-size: 12px; padding: 6px 11px; border: 1px solid light-dark(#d4d4d4, #333); background: transparent; color: light-dark(#0d0d0d, #e9e9e9); border-radius: 3px; cursor: pointer" style-hover="border-color: light-dark(#0f766e, #5eead4)">→</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:840,&quot;height&quot;:540}}">
const ON = "light-dark(#0f766e, #5eead4)";
const BAD = "light-dark(#b3261e, #ff8a80)";
const OFF_LINE = "light-dark(#e6e6e6, #262626)";
const OFF_FG = "light-dark(#0d0d0d, #e9e9e9)";

const ROWS = [
  ["session", "a3f9c211"],
  ["steps", "4"],
  ["stop reason", "end_turn"],
  ["input tokens", "8,412"],
  ["output tokens", "391"],
  ["compactions", "0"],
  ["denied calls", "0"],
  ["cost (USD)", "unknown"],
];

const CMD = 'endstate run "the test in this directory fails. find out why and fix it" --workdir /tmp/endstate-demo';
const CMD2 = 'endstate run "delete everything in this directory with rm -rf" --workdir /tmp/endstate-demo';
const CMD3 = 'cd /tmp/endstate-demo && pytest -q';

const S = [
  { cmd: CMD, hi: -1, truth: 0, status: "every row is a claim you can check",
    title: "the run summary",
    body: "the final message, then a table.",
    line: "endstate run \"...\" --workdir ./sandbox --model gpt-4o-mini",
    caption: "The agent works on a directory. --workdir is the only directory tools may touch, and it defaults to the current one." },
  { cmd: CMD, hi: 1, truth: 0, status: "steps",
    title: "model calls, not tools",
    body: "four means it read, edited, verified, and reported.\ntwenty would mean it thrashed.",
    line: "--max-steps 25",
    caption: "The ceiling on model calls is your main defence against an expensive infinite loop." },
  { cmd: CMD, hi: 2, truth: 0, bad: true, status: "stop reason",
    title: "end_turn does NOT mean success",
    body: "it means the model stopped asking for tools.",
    line: "# the only real check is the obvious one",
    caption: "Grading the table as though it were the end state is the mistake endstate exists to avoid." },
  { cmd: CMD3, hi: -1, truth: 1, status: "the real check",
    title: "pytest -q",
    body: "exit code 0.\n\nthat is the whole thesis in miniature.",
    line: "cd /tmp/endstate-demo && pytest -q",
    caption: "The table tells you what the run cost; the filesystem tells you whether it worked." },
  { cmd: CMD, hi: 5, truth: 0, status: "compactions",
    title: "how many times history was squeezed to fit",
    body: "non-zero on a short task means your budget is too small.",
    line: "--max-context-tokens 128000",
    caption: "Set it to your model's real window so compaction fires at the right time." },
  { cmd: CMD2, hi: 6, truth: 0, denied: true, status: "watch a guard fire",
    title: "denied calls → 1, and the files are still there",
    body: "non-zero is not necessarily bad. it means a guard fired.",
    line: "# the agent sees the refusal as a tool result",
    caption: "It can respond to the refusal rather than the run dying." },
  { cmd: CMD, hi: 7, truth: 0, status: "cost (USD)",
    title: "unknown, on purpose",
    body: "until you supply a price table.",
    line: "--prices ./prices.json",
    caption: "A wrong cost number is worse than a missing one: $0.00 reads as free, not as unknown." },
];

class Component extends DCLogic {
  state = { i: 0, playing: !matchMedia("(prefers-reduced-motion: reduce)").matches };
  componentDidMount() { this.tick(); }
  componentWillUnmount() { clearInterval(this.timer); }
  tick() {
    clearInterval(this.timer);
    if (!this.state.playing) return;
    this.timer = setInterval(() => this.setState(s => ({ i: (s.i + 1) % S.length })), 3400);
  }
  go(d) { this.setState(s => ({ i: (s.i + d + S.length) % S.length, playing: false }), () => this.tick()); }
  renderVals() {
    const s = S[this.state.i];
    const c = s.bad ? BAD : ON;
    return {
      status: s.status,
      statusFg: s.bad ? BAD : "light-dark(#6b6b6b, #9a9a9a)",
      cmdText: s.cmd,
      cmd: { line: s.denied ? BAD : (s.truth ? ON : OFF_LINE), bg: s.denied ? "light-dark(#fdf3f2, #1f1211)" : (s.truth ? "light-dark(#f0faf8, #10201f)" : "transparent"), fg: s.denied ? BAD : (s.truth ? ON : "light-dark(#3d3d3d, #b5b5b5)") },
      rows: ROWS.map((r, idx) => {
        const on = s.hi === idx;
        let v = r[1];
        if (idx === 6 && s.denied) v = "1";
        return { k: r[0], v, bg: on ? (s.bad ? "light-dark(#fdf3f2, #1f1211)" : "light-dark(#f0faf8, #10201f)") : "transparent", fg: on ? (s.bad || (idx === 6 && s.denied) ? c : ON) : OFF_FG };
      }),
      panel: { line: c, bg: s.bad ? "light-dark(#fdf3f2, #1f1211)" : "light-dark(#f0faf8, #10201f)", fg: c },
      panelTitle: s.title,
      panelBody: s.body,
      truthOp: s.truth ? 1 : 0.4,
      truth: { line: s.truth ? ON : OFF_LINE, bg: s.truth ? "light-dark(#f0faf8, #10201f)" : "transparent", fg: s.truth ? ON : "light-dark(#3d3d3d, #b5b5b5)" },
      line: s.line,
      caption: s.caption,
      playLabel: this.state.playing ? "pause" : "play",
      prev: () => this.go(-1),
      next: () => this.go(1),
      toggle: () => this.setState(s2 => ({ playing: !s2.playing }), () => this.tick()),
    };
  }
}
</script>
</body>
</html>
