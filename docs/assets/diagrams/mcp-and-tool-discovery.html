<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
// Serve React from this site rather than unpkg: the docs must not depend on a
// third-party CDN at page-view time. support.js honours __resources as an
// override for its pinned CDN URLs (the files are byte-identical to the ones
// its SRI hashes cover).
window.__resources = {
  "https://unpkg.com/react@18.3.1/umd/react.production.min.js": "./vendor/react-18.3.1.production.min.js",
  "https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js": "./vendor/react-dom-18.3.1.production.min.js"
};
</script>
<script src="./support.js"></script>
<script>
// Follow the Material palette toggle in the parent page; fall back to the system setting.
(function () {
  var current = null;
  function apply(scheme) {
    if (scheme !== "light" && scheme !== "dark") return;
    current = scheme;
    // Both elements: the stylesheet sets color-scheme on html *and* body, and
    // light-dark() inside the body resolves against the body's own value.
    document.documentElement.style.colorScheme = scheme;
    if (document.body) document.body.style.colorScheme = scheme;
  }
  addEventListener("DOMContentLoaded", function () {
    if (current) apply(current);
  });
  var q = new URLSearchParams(location.search).get("theme");
  if (q) apply(q);
  addEventListener("message", function (e) {
    if (e.data && e.data.type === "endstate-theme") apply(e.data.scheme);
  });
  addEventListener("load", function () {
    if (parent !== window) parent.postMessage({ type: "endstate-diagram-ready" }, "*");
  });
})();
</script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="crossorigin">
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700%7CRoboto+Mono:400,500,700&display=swap">
<style>
  html, body { margin: 0; padding: 0; color-scheme: light dark; background: light-dark(#ffffff, #0d0d0d); }
  a { color: light-dark(#0f766e, #5eead4); }
  a:hover { color: light-dark(#0b5c56, #99f6e4); }
</style>
</helmet>
<div style="font-family: Roboto, Helvetica, Arial, sans-serif; color: light-dark(#0d0d0d, #e9e9e9); background: light-dark(#ffffff, #0d0d0d); padding: 28px 32px 24px; display: flex; flex-direction: column; gap: 18px; box-sizing: border-box">

  <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 24px; flex-wrap: wrap">
    <div style="display: flex; align-items: baseline; gap: 14px">
      <div style="font-size: 19px; font-weight: 500; letter-spacing: -.01em">MCP and tool discovery</div>
      <div style="font-family: 'Roboto Mono', monospace; font-size: 12px; color: light-dark(#6b6b6b, #9a9a9a)">tools as a runtime catalogue</div>
    </div>
    <div style="font-family: 'Roboto Mono', monospace; font-size: 12px; transition: color .35s ease; color: {{ statusFg }}">{{ status }}</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 9px">
    <div style="display: flex; justify-content: space-between; align-items: baseline; font-family: 'Roboto Mono', monospace; font-size: 11px">
      <span style="color: light-dark(#6b6b6b, #9a9a9a)">context window</span>
      <span style="transition: color .5s ease; color: {{ totalFg }}">{{ total }}</span>
    </div>
    <div style="display: flex; height: 26px; gap: 2px; border: 1px solid light-dark(#e0e0e0, #2e2e2e); border-radius: 2px; padding: 2px; background: light-dark(#fafafa, #141414)">
      <div style="border-radius: 1px; display: flex; align-items: center; padding-left: 7px; overflow: hidden; transition: all .7s cubic-bezier(.4,0,.2,1); width: {{ bar.schemaW }}; background: {{ bar.schemaBg }}">
        <span style="font-family: 'Roboto Mono', monospace; font-size: 9.5px; white-space: nowrap; transition: color .5s ease; color: {{ bar.schemaFg }}">{{ bar.schemaLabel }}</span>
      </div>
      <div style="border-radius: 1px; display: flex; align-items: center; padding-left: 7px; overflow: hidden; transition: all .7s cubic-bezier(.4,0,.2,1); width: {{ bar.payloadW }}; background: {{ bar.payloadBg }}">
        <span style="font-family: 'Roboto Mono', monospace; font-size: 9.5px; white-space: nowrap; transition: color .5s ease; color: {{ bar.payloadFg }}">{{ bar.payloadLabel }}</span>
      </div>
      <div style="flex: 1; border-radius: 1px; display: flex; align-items: center; padding-left: 7px; overflow: hidden">
        <span style="font-family: 'Roboto Mono', monospace; font-size: 9.5px; white-space: nowrap; color: light-dark(#a8a8a8, #5a5a5a)">room for the actual task</span>
      </div>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start">

    <div style="border: 1px solid; border-radius: 3px; padding: 13px 15px; display: flex; flex-direction: column; gap: 9px; min-height: 176px; transition: all .4s ease; border-color: {{ left.line }}; background: {{ left.bg }}">
      <div style="font-family: 'Roboto Mono', monospace; font-size: 12px; font-weight: 500; color: {{ left.fg }}">{{ leftTitle }}</div>
      <div style="font-family: 'Roboto Mono', monospace; font-size: 11px; line-height: 1.65; white-space: pre-line; color: light-dark(#6b6b6b, #9a9a9a)">{{ leftBody }}</div>
    </div>

    <div style="border: 1px solid; border-radius: 3px; padding: 13px 15px; display: flex; flex-direction: column; gap: 9px; min-height: 176px; transition: all .4s ease; border-color: {{ right.line }}; background: {{ right.bg }}">
      <div style="font-family: 'Roboto Mono', monospace; font-size: 12px; font-weight: 500; color: {{ right.fg }}">{{ rightTitle }}</div>
      <div style="font-family: 'Roboto Mono', monospace; font-size: 11px; line-height: 1.65; white-space: pre-line; color: light-dark(#6b6b6b, #9a9a9a)">{{ rightBody }}</div>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; transition: opacity .4s ease; opacity: {{ probOp }}">
    <sc-for list="{{ problems }}" as="p" hint-placeholder-count="3">
      <div style="border: 1px solid; border-radius: 3px; padding: 9px 11px; transition: all .4s ease; border-color: {{ p.line }}; background: {{ p.bg }}">
        <div style="font-family: 'Roboto Mono', monospace; font-size: 11px; font-weight: 500; color: {{ p.fg }}">{{ p.n }}</div>
        <div style="font-size: 11px; line-height: 1.4; margin-top: 4px; color: light-dark(#6b6b6b, #9a9a9a)">{{ p.text }}</div>
      </div>
    </sc-for>
  </div>

  <div style="display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 28px; align-items: end; border-top: 1px solid light-dark(#e6e6e6, #262626); padding-top: 16px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-family: 'Roboto Mono', monospace; font-size: 12px; color: light-dark(#0f766e, #5eead4)">{{ line }}</div>
      <div style="font-size: 13.5px; line-height: 1.5; min-height: 42px; max-width: 78ch; color: light-dark(#3d3d3d, #b5b5b5); text-wrap: pretty">{{ caption }}</div>
    </div>
    <div style="display: flex; align-items: center; gap: 8px">
      <button onClick="{{ prev }}" style="font-family: 'Roboto Mono', monospace; font-size: 12px; padding: 6px 11px; border: 1px solid light-dark(#d4d4d4, #333); background: transparent; color: light-dark(#0d0d0d, #e9e9e9); border-radius: 3px; cursor: pointer" style-hover="border-color: light-dark(#0f766e, #5eead4)">←</button>
      <button onClick="{{ toggle }}" style="font-family: 'Roboto Mono', monospace; font-size: 12px; padding: 6px 13px; border: 1px solid light-dark(#d4d4d4, #333); background: transparent; color: light-dark(#0d0d0d, #e9e9e9); border-radius: 3px; cursor: pointer; min-width: 62px" style-hover="border-color: light-dark(#0f766e, #5eead4)">{{ playLabel }}</button>
      <button onClick="{{ next }}" style="font-family: 'Roboto Mono', monospace; font-size: 12px; padding: 6px 11px; border: 1px solid light-dark(#d4d4d4, #333); background: transparent; color: light-dark(#0d0d0d, #e9e9e9); border-radius: 3px; cursor: pointer" style-hover="border-color: light-dark(#0f766e, #5eead4)">→</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:840,&quot;height&quot;:620}}">
const ON = "light-dark(#0f766e, #5eead4)";
const BAD = "light-dark(#b3261e, #ff8a80)";
const OFF_LINE = "light-dark(#e6e6e6, #262626)";
const OFF_FG = "light-dark(#3d3d3d, #b5b5b5)";

const PROBLEMS = [
  { n: "1 · always-on schemas", text: "hundreds of thousands of tokens before the user's request is read" },
  { n: "2 · double transit", text: "a transcript read into context, then written back out verbatim" },
  { n: "3 · choosing between 400", text: "two servers both expose a search; the agent picks the plausible wrong one" },
];

const S = [
  { status: "six tools, hardcoded", schema: 8, payload: 0, total: "~1_500 tokens of schema", bad: false, prob: -1, side: 0,
    leftTitle: "the harness in these docs", leftBody: "read · write · edit\nglob · grep · bash\n\na dict built at startup",
    rightTitle: "a production agent", rightBody: "a dozen MCP servers\nattached at runtime\n\nthe number goes up\nevery quarter",
    line: "# tools as a static list vs tools as a runtime catalogue",
    caption: "A server exposes tools; a client discovers them, advertises them to the model, and executes the calls. That is the good part, and it is genuinely good. The rest is what it costs." },
  { status: "problem one", schema: 66, payload: 0, total: "hundreds of thousands of tokens", bad: true, prob: 0, side: 0,
    leftTitle: "gdrive.getDocument", leftBody: "Description: Retrieves a document\nParameters:\n  documentId (required, string)\n  fields (optional, string)\nReturns: Document object with title,\n  body content, metadata, permissions",
    rightTitle: "× a few hundred", rightBody: "paid on every step of\nevery run — and it degrades\nattention on the tokens\nthat actually matter",
    line: "# tool definitions are always-on context",
    caption: "MCP does not create the problem — a tool description is prompt engineering wearing a docstring costume either way. It multiplies it by the size of the ecosystem." },
  { status: "problem two", schema: 40, payload: 44, total: "+50_000 tokens that move no information", bad: true, prob: 1, side: 0,
    leftTitle: "TOOL CALL: gdrive.getDocument", leftBody: "→ returns the full transcript\n  (into context)",
    rightTitle: "TOOL CALL: salesforce.updateRecord", rightBody: "data: { Notes: \"<the full\n  transcript again>\" }\n→ the model writes it back out\n  (into context, again)",
    line: "# 50,000 opportunities to make a copying error",
    caption: "For a larger document it does not merely cost money — it exceeds the window and the workflow breaks." },
  { status: "problem three", schema: 66, payload: 0, total: "400 tools, overlapping", bad: true, prob: 2, side: 0,
    leftTitle: "servers/a: search", leftBody: "returns documents",
    rightTitle: "servers/b: search", rightBody: "returns tickets\n\nwhat breaks the tie?",
    line: "# the failure mode is not \"no tool found\"",
    caption: "It is picking the plausible wrong one and proceeding confidently. If a senior engineer cannot say without hesitation which tool applies, an agent cannot be expected to do better." },
  { status: "tools as files", schema: 6, payload: 0, total: "progressive disclosure", bad: false, prob: -1, side: 1,
    leftTitle: "servers/", leftBody: "├── google-drive\n│   ├── getDocument.ts\n│   └── ...\n├── salesforce\n│   ├── updateRecord.ts\n│   └── ...\n└── ...",
    rightTitle: "list, then read two files", rightBody: "the agent sees what exists,\nreads only what it needs,\nthen writes code that\ncalls them",
    line: "const transcript = (await gdrive.getDocument({...})).content;",
    caption: "The same trick skills use, applied to tool schemas instead of instructions. The transcript never enters the context window." },
  { status: "150_000 → 2_000", schema: 3, payload: 0, total: "98.7% reduction", bad: false, prob: -1, side: 1, win: true,
    leftTitle: "measured on that exact example", leftBody: "150_000 tokens\n        ↓\n  2_000 tokens",
    rightTitle: "and what it buys beyond tokens", rightBody: "filtering before the model sees it\nreal control flow — loops, retries\nlower time-to-first-token\nintermediate values stay in the sandbox\nstate between steps",
    line: "# 10,000 spreadsheet rows become five, in code, not in context",
    caption: "Cloudflare arrived at the same design independently and called it Code Mode. Running model-generated code needs a sandbox with resource limits — a token bill traded for an operational one." },
  { status: "one trust boundary per server", schema: 40, payload: 0, total: "the threat model changes", bad: true, prob: -1, side: 0,
    leftTitle: "direct tool calls", leftBody: "one trust boundary:\nthe harness",
    rightTitle: "MCP", rightBody: "one per server — third-party code\nthat reads the agent's arguments,\nreturns arbitrary text into its\ncontext, and can change behaviour\nafter you audited it",
    line: "# the GitHub MCP exploit assembled all three properties inside one server",
    caption: "The agent read a malicious issue on a public repo, followed it into the private repos the user had authorised, and leaked their contents through a pull request. GitHub could not fix it server-side — the flaw is in the agent system, not the server code." },
  { status: "why this harness stays at six", schema: 8, payload: 0, total: "a control variable", bad: false, prob: -1, side: 0,
    leftTitle: "not because MCP is wrong", leftBody: "a fixed, small, auditable\ntool set is a control variable",
    rightTitle: "if the catalogue changes between runs", rightBody: "a cost table and a task pass-rate\nstop being comparable to each other,\nand the benchmark stops\nmeaning anything",
    line: "# a decision about scope, not about the protocol",
    caption: "The argument this project is making is about measuring end states, and that requires holding the tool set still." },
];

class Component extends DCLogic {
  state = { i: 0, playing: !matchMedia("(prefers-reduced-motion: reduce)").matches };
  componentDidMount() { this.tick(); }
  componentWillUnmount() { clearInterval(this.timer); }
  tick() {
    clearInterval(this.timer);
    if (!this.state.playing) return;
    this.timer = setInterval(() => this.setState(s => ({ i: (s.i + 1) % S.length })), 3600);
  }
  go(d) { this.setState(s => ({ i: (s.i + d + S.length) % S.length, playing: false }), () => this.tick()); }
  renderVals() {
    const s = S[this.state.i];
    const c = s.bad ? BAD : ON;
    return {
      status: s.status,
      statusFg: s.bad ? BAD : "light-dark(#6b6b6b, #9a9a9a)",
      total: s.total,
      totalFg: s.bad ? BAD : (s.win ? ON : "light-dark(#6b6b6b, #9a9a9a)"),
      bar: {
        schemaW: s.schema + "%",
        schemaBg: s.bad ? "light-dark(rgba(179,38,30,.20), rgba(255,138,128,.22))" : "light-dark(rgba(15,118,110,.22), rgba(94,234,212,.22))",
        schemaFg: s.bad ? BAD : ON,
        schemaLabel: s.schema > 12 ? "tool schemas" : "",
        payloadW: s.payload + "%",
        payloadBg: "light-dark(rgba(179,38,30,.10), rgba(255,138,128,.12))",
        payloadFg: BAD,
        payloadLabel: s.payload > 12 ? "the transcript, twice" : "",
      },
      left: { line: s.side === 1 ? ON : (s.bad ? BAD : OFF_LINE), bg: s.side === 1 ? "light-dark(#f0faf8, #10201f)" : (s.bad ? "light-dark(#fdf3f2, #1f1211)" : "transparent"), fg: s.side === 1 ? ON : (s.bad ? BAD : OFF_FG) },
      right: { line: s.side === 1 ? ON : (s.bad ? BAD : OFF_LINE), bg: s.side === 1 ? "light-dark(#f0faf8, #10201f)" : (s.bad ? "light-dark(#fdf3f2, #1f1211)" : "transparent"), fg: s.side === 1 ? ON : (s.bad ? BAD : OFF_FG) },
      leftTitle: s.leftTitle, leftBody: s.leftBody, rightTitle: s.rightTitle, rightBody: s.rightBody,
      probOp: s.prob >= 0 ? 1 : 0.35,
      problems: PROBLEMS.map((p, idx) => ({
        n: p.n, text: p.text,
        line: s.prob === idx ? BAD : OFF_LINE,
        bg: s.prob === idx ? "light-dark(#fdf3f2, #1f1211)" : "transparent",
        fg: s.prob === idx ? BAD : OFF_FG,
      })),
      line: s.line,
      caption: s.caption,
      playLabel: this.state.playing ? "pause" : "play",
      prev: () => this.go(-1),
      next: () => this.go(1),
      toggle: () => this.setState(s2 => ({ playing: !s2.playing }), () => this.tick()),
    };
  }
}
</script>
</body>
</html>
