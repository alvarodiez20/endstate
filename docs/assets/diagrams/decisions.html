<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
// Serve React from this site rather than unpkg: the docs must not depend on a
// third-party CDN at page-view time. support.js honours __resources as an
// override for its pinned CDN URLs (the files are byte-identical to the ones
// its SRI hashes cover).
window.__resources = {
  "https://unpkg.com/react@18.3.1/umd/react.production.min.js": "./vendor/react-18.3.1.production.min.js",
  "https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js": "./vendor/react-dom-18.3.1.production.min.js"
};
</script>
<script src="./support.js"></script>
<script>
// Follow the Material palette toggle in the parent page; fall back to the system setting.
(function () {
  var current = null;
  function apply(scheme) {
    if (scheme !== "light" && scheme !== "dark") return;
    current = scheme;
    // Both elements: the stylesheet sets color-scheme on html *and* body, and
    // light-dark() inside the body resolves against the body's own value.
    document.documentElement.style.colorScheme = scheme;
    if (document.body) document.body.style.colorScheme = scheme;
  }
  addEventListener("DOMContentLoaded", function () {
    if (current) apply(current);
  });
  var q = new URLSearchParams(location.search).get("theme");
  if (q) apply(q);
  addEventListener("message", function (e) {
    if (e.data && e.data.type === "endstate-theme") apply(e.data.scheme);
  });
  addEventListener("load", function () {
    if (parent !== window) parent.postMessage({ type: "endstate-diagram-ready" }, "*");
  });
})();
</script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="crossorigin">
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700%7CRoboto+Mono:400,500,700&display=swap">
<style>
  html, body { margin: 0; padding: 0; color-scheme: light dark; background: light-dark(#ffffff, #0d0d0d); }
  a { color: light-dark(#0f766e, #5eead4); }
  a:hover { color: light-dark(#0b5c56, #99f6e4); }
</style>
</helmet>
<div style="font-family: Roboto, Helvetica, Arial, sans-serif; color: light-dark(#0d0d0d, #e9e9e9); background: light-dark(#ffffff, #0d0d0d); padding: 28px 32px 24px; display: flex; flex-direction: column; gap: 18px; box-sizing: border-box">

  <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 24px; flex-wrap: wrap">
    <div style="display: flex; align-items: baseline; gap: 14px">
      <div style="font-size: 19px; font-weight: 500; letter-spacing: -.01em">Decision log</div>
      <div style="font-family: 'Roboto Mono', monospace; font-size: 12px; color: light-dark(#6b6b6b, #9a9a9a)">D1 – D8</div>
    </div>
    <div style="font-family: 'Roboto Mono', monospace; font-size: 12px; color: light-dark(#6b6b6b, #9a9a9a)">hover a decision · a decision with no rejected alternative is not a decision</div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
    <sc-for list="{{ cards }}" as="d" hint-placeholder-count="8">
      <div onMouseEnter="{{ d.enter }}" style="border: 1px solid; border-radius: 3px; padding: 10px 11px; display: flex; flex-direction: column; gap: 6px; cursor: default; transition: all .3s ease; border-color: {{ d.line }}; background: {{ d.bg }}">
        <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px">
          <div style="font-family: 'Roboto Mono', monospace; font-size: 11.5px; font-weight: 500; color: {{ d.fg }}">{{ d.id }}</div>
          <div style="font-family: 'Roboto Mono', monospace; font-size: 9.5px; color: light-dark(#8a8a8a, #6b6b6b)">{{ d.page }}</div>
        </div>
        <div style="font-size: 12px; line-height: 1.35; font-weight: 500; letter-spacing: -.005em; color: {{ d.titleFg }}">{{ d.title }}</div>
      </div>
    </sc-for>
  </div>

  <div style="display: grid; grid-template-columns: minmax(0, 1fr) 22px minmax(0, 1fr); gap: 0; align-items: stretch">
    <div style="border: 1px solid; border-radius: 3px; padding: 13px 15px; display: flex; flex-direction: column; gap: 7px; transition: all .4s ease; border-color: {{ chosen.line }}; background: {{ chosen.bg }}">
      <div style="font-family: 'Roboto Mono', monospace; font-size: 10.5px; color: light-dark(#8a8a8a, #6b6b6b)">chosen</div>
      <div style="font-size: 13.5px; font-weight: 500; letter-spacing: -.005em; color: {{ chosen.fg }}">{{ chosenText }}</div>
    </div>
    <div style="display: flex; align-items: center; justify-content: center; font-family: 'Roboto Mono', monospace; font-size: 11px; color: light-dark(#8a8a8a, #6b6b6b)">vs</div>
    <div style="border: 1px solid light-dark(#e6e6e6, #262626); border-radius: 3px; padding: 13px 15px; display: flex; flex-direction: column; gap: 7px; background: light-dark(#fafafa, #131313)">
      <div style="font-family: 'Roboto Mono', monospace; font-size: 10.5px; color: light-dark(#8a8a8a, #6b6b6b)">rejected</div>
      <div style="font-size: 13.5px; font-weight: 500; letter-spacing: -.005em; text-decoration: line-through; text-decoration-thickness: 1px; color: light-dark(#9a9a9a, #6b6b6b)">{{ rejectedText }}</div>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 28px; align-items: end; border-top: 1px solid light-dark(#e6e6e6, #262626); padding-top: 16px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-family: 'Roboto Mono', monospace; font-size: 12px; color: light-dark(#0f766e, #5eead4)">{{ line }}</div>
      <div style="font-size: 13.5px; line-height: 1.5; min-height: 42px; max-width: 78ch; color: light-dark(#3d3d3d, #b5b5b5); text-wrap: pretty">{{ caption }}</div>
    </div>
    <div style="display: flex; align-items: center; gap: 8px">
      <button onClick="{{ prev }}" style="font-family: 'Roboto Mono', monospace; font-size: 12px; padding: 6px 11px; border: 1px solid light-dark(#d4d4d4, #333); background: transparent; color: light-dark(#0d0d0d, #e9e9e9); border-radius: 3px; cursor: pointer" style-hover="border-color: light-dark(#0f766e, #5eead4)">←</button>
      <button onClick="{{ toggle }}" style="font-family: 'Roboto Mono', monospace; font-size: 12px; padding: 6px 13px; border: 1px solid light-dark(#d4d4d4, #333); background: transparent; color: light-dark(#0d0d0d, #e9e9e9); border-radius: 3px; cursor: pointer; min-width: 62px" style-hover="border-color: light-dark(#0f766e, #5eead4)">{{ playLabel }}</button>
      <button onClick="{{ next }}" style="font-family: 'Roboto Mono', monospace; font-size: 12px; padding: 6px 11px; border: 1px solid light-dark(#d4d4d4, #333); background: transparent; color: light-dark(#0d0d0d, #e9e9e9); border-radius: 3px; cursor: pointer" style-hover="border-color: light-dark(#0f766e, #5eead4)">→</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:840,&quot;height&quot;:520}}">
const ON = "light-dark(#0f766e, #5eead4)";
const OFF_LINE = "light-dark(#e6e6e6, #262626)";
const OFF_FG = "light-dark(#3d3d3d, #b5b5b5)";

const D = [
  { id: "D1", page: "the loop", title: "Build the loop from primitives",
    chosen: "the harness IS the artifact", rejected: "LangGraph, or any agent framework",
    line: "# a framework hides exactly the parts worth examining",
    caption: "Where the context budget is enforced, what happens when a tool is denied, what is persisted before a step can fail. There is a real cost: things a framework gives you free are hand-written here." },
  { id: "D2", page: "evaluation", title: "Deterministic graders",
    chosen: "run pytest, check the exit code", rejected: "LLM-as-judge",
    line: "# harder to write and impossible to argue with",
    caption: "A judge is another non-deterministic system to debug, and its failures correlate with the agent's." },
  { id: "D3", page: "durability", title: "SQLite for sessions",
    chosen: "one writer, small records, survives the process dying", rejected: "Postgres, Redis",
    line: "# checkpointing is a durability problem, not a scale problem",
    caption: "Requiring infrastructure before anyone can try the tool is an adoption cost paid for nothing." },
  { id: "D4", page: "cost", title: "Prices are user-supplied data",
    chosen: "an unknown price raises", rejected: "a hardcoded table, or returning zero",
    line: "# $0.00 reads as \"free\", not as \"unknown\"",
    caption: "Prices change often and vary by region and contract. A wrong cost number is worse than a missing one, and someone will make a decision on it." },
  { id: "D5", page: "permissions", title: "Default-deny permission policy",
    chosen: "state everything the agent may do", rejected: "default-allow with a deny-list",
    line: "# the failure modes are asymmetric",
    caption: "A wrongly denied command is an annoyance; a wrongly allowed one is an incident. A policy that treats them symmetrically is wrong." },
  { id: "D6", page: "context", title: "Heuristic token counter by default",
    chosen: "TokenCounter is a Protocol — an exact counter is a one-line swap", rejected: "per-provider tokenisers as a hard dependency",
    line: "# must work against providers whose tokeniser is not public",
    caption: "Including most self-hosted models." },
  { id: "D7", page: "sandbox", title: "One disposable container per eval task",
    chosen: "determinism, parallelism, and a boundary that is real", rejected: "a shared sandbox with subprocess isolation",
    line: "# the only reason it is sane to hand an agent a shell",
    caption: "Everything else in the tool layer is defence in depth behind this boundary." },
  { id: "D8", page: "durability", title: "Checkpoint after the tool result",
    chosen: "persist outcomes, at per-call granularity", rejected: "checkpointing before the step",
    line: "# never intentions",
    caption: "Re-applying an already-applied side effect on resume is the classic bug. Resume reconciles anything left outstanding." },
];

class Component extends DCLogic {
  state = { i: 0, playing: !matchMedia("(prefers-reduced-motion: reduce)").matches };
  componentDidMount() { this.tick(); }
  componentWillUnmount() { clearInterval(this.timer); }
  tick() {
    clearInterval(this.timer);
    if (!this.state.playing) return;
    this.timer = setInterval(() => this.setState(s => ({ i: (s.i + 1) % D.length })), 3200);
  }
  go(d) { this.setState(s => ({ i: (s.i + d + D.length) % D.length, playing: false }), () => this.tick()); }
  hover(idx) { this.setState({ i: idx, playing: false }, () => this.tick()); }
  renderVals() {
    const i = this.state.i, d = D[i];
    return {
      cards: D.map((x, idx) => ({
        id: x.id, page: x.page, title: x.title,
        line: i === idx ? ON : OFF_LINE,
        bg: i === idx ? "light-dark(#f0faf8, #10201f)" : "transparent",
        fg: i === idx ? ON : "light-dark(#8a8a8a, #6b6b6b)",
        titleFg: i === idx ? ON : OFF_FG,
        enter: () => this.hover(idx),
      })),
      chosen: { line: ON, bg: "light-dark(#f0faf8, #10201f)", fg: ON },
      chosenText: d.chosen,
      rejectedText: d.rejected,
      line: d.line,
      caption: d.caption,
      playLabel: this.state.playing ? "pause" : "play",
      prev: () => this.go(-1),
      next: () => this.go(1),
      toggle: () => this.setState(s2 => ({ playing: !s2.playing }), () => this.tick()),
    };
  }
}
</script>
</body>
</html>
