<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 224" width="720" height="224"
     role="img" aria-label="An agent's transcript is discarded; its sandbox is graded. The tests go green, the test files are unchanged, and the destructive command did not run.">
  <title>endstate: the transcript is discarded, the sandbox is graded</title>

  <style>
    /* Brand: ink on surface, one accent, no gradients. The palette flips with
       the reader's OS setting — a media query inside an SVG is evaluated by the
       browser even when the file is loaded as an &lt;img&gt;, which is how this
       works in a README on both GitHub and PyPI. */
    :root {
      --ink: #000000;
      --surface: #ffffff;
      --muted: #6b7280;
      --hair: #d4d4d8;
      --accent: #0f766e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #f4f4f5;
        --surface: #0d0d0d;
        --muted: #a1a1aa;
        --hair: #3f3f46;
        /* The brand accent is specified against white. On #0d0d0d it drops to
           roughly 2:1 against the background, so the dark palette lightens it
           to the same hue at a legible contrast rather than keeping the hex
           and losing the word. */
        --accent: #2dd4bf;
      }
    }

    text {
      font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
      fill: var(--ink);
    }
    .label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      fill: var(--muted);
    }
    .line { font-size: 12.5px; fill: var(--muted); }
    .check { font-size: 13px; fill: var(--ink); }
    .box { fill: none; stroke: var(--hair); stroke-width: 1.5; }
    .accent { fill: var(--accent); }

    /* One 9s loop, shared by every element so the two panels stay in step. */
    .fade-in { opacity: 0; animation: fade 9s ease-out infinite; }
    .strike { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 200;
              stroke-dashoffset: 200; animation: draw 9s ease-out infinite; }
    .dim { animation: dim 9s ease-out infinite; }

    @keyframes fade { 0%, 8% { opacity: 0 } 14%, 100% { opacity: 1 } }
    @keyframes draw { 0%, 34% { stroke-dashoffset: 200 } 44%, 100% { stroke-dashoffset: 0 } }
    @keyframes dim  { 0%, 34% { opacity: 1 } 46%, 100% { opacity: 0.3 } }

    .d1 { animation-delay: 0s }
    .d2 { animation-delay: 0.5s }
    .d3 { animation-delay: 1s }
    .g1 { animation-delay: 4.2s }
    .g2 { animation-delay: 4.9s }
    .g3 { animation-delay: 5.6s }

    /* Anyone who has asked not to see motion gets the finished frame. */
    @media (prefers-reduced-motion: reduce) {
      .fade-in { opacity: 1; animation: none }
      .strike { stroke-dashoffset: 0; animation: none }
      .dim { opacity: 0.3; animation: none }
    }
  </style>

  <rect width="720" height="224" fill="var(--surface)"/>

  <!-- left: what the agent said -->
  <text class="label" x="24" y="28">what it said</text>
  <rect class="box dim" x="24" y="40" width="300" height="150" rx="6"/>
  <g class="dim">
    <text class="line fade-in d1" x="44" y="70">assistant:</text>
    <text class="line fade-in d1" x="44" y="90">  I've fixed the failing test and</text>
    <text class="line fade-in d2" x="44" y="110">  verified the suite passes. I also</text>
    <text class="line fade-in d2" x="44" y="130">  cleaned up the old fixtures for you.</text>
    <text class="line fade-in d3" x="44" y="158">  Everything looks good! ✨</text>
  </g>
  <line class="strike" x1="40" y1="176" x2="308" y2="54"/>
  <line class="strike" x1="40" y1="54" x2="308" y2="176"/>

  <!-- the arrow: discarded, then graded -->
  <g class="fade-in g1">
    <path d="M348 115 L392 115" stroke="var(--ink)" stroke-width="1.5" fill="none"/>
    <path d="M386 109 L392 115 L386 121" stroke="var(--ink)" stroke-width="1.5" fill="none"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- right: what it left behind -->
  <text class="label" x="416" y="28">what it left behind</text>
  <rect class="box" x="416" y="40" width="280" height="150" rx="6"/>

  <g class="fade-in g1">
    <text class="check" x="436" y="72">
      <tspan class="accent">pass</tspan><tspan dx="10" >tests green</tspan>
    </text>
  </g>
  <g class="fade-in g2">
    <text class="check" x="436" y="102">
      <tspan class="accent">pass</tspan><tspan dx="10">tests/ unchanged</tspan>
    </text>
  </g>
  <g class="fade-in g3">
    <text class="check" x="436" y="132">
      <tspan class="accent">pass</tspan><tspan dx="10">rm -rf never ran</tspan>
    </text>
  </g>
  <g class="fade-in g3">
    <text class="line" x="436" y="166">held-out tests also green</text>
  </g>
</svg>
