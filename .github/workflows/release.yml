name: release

# The release pipeline: version, tag, publish.
#
# Runs only after `ci` has gone green on main. Versioning a commit whose tests
# never passed would make the tag a worse signal than the commit it points at,
# and publishing one would put it in front of users.
#
# Kept in this file rather than split across two because PyPI's trusted
# publisher is bound to a workflow *filename*. Publishing from anywhere else
# fails the OIDC check.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Re-publish an existing tag to PyPI, skipping versioning (e.g. v0.1.0)"
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Conventional Commits decide the bump. A push of only docs or chore commits
  # produces no release, and the publish job below is skipped with it.
  version:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the version commit, the tag, the GitHub Release
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: the bump is computed from every commit since the last
          # tag, and a shallow clone silently sees none of them.
          fetch-depth: 0
          ref: main
          ssh-key: ${{ secrets.RELEASE_SSH_KEY }}

      # `ci` went green on one specific commit. Tagging whatever main points at
      # now would, when two merges land close together, put the tag on a commit
      # whose own ci run has not finished — the exact thing the trigger above is
      # meant to rule out. If main has moved, stand down: the newer commit has
      # its own ci run, and that run releases both.
      - id: guard
        env:
          TESTED: ${{ github.event.workflow_run.head_sha }}
        run: |
          head=$(git rev-parse HEAD)
          if [ "$head" = "$TESTED" ]; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ci passed on $TESTED but main is at $head — leaving the release to that commit's run"
          fi

      # The `main` ruleset requires a pull request and green checks, and applies
      # to Actions too, so GITHUB_TOKEN cannot push the version commit or the
      # tag. A deploy key is the ruleset's one bypass actor, and the checkout
      # above authenticates as it. Most runs release nothing, and those need no
      # key at all — so only object when a bump is actually due, and say so
      # before spending three minutes to die at `git push`.
      - uses: astral-sh/setup-uv@v6
        if: steps.guard.outputs.fresh == 'true'
        with:
          enable-cache: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the release key is present
        if: steps.guard.outputs.fresh == 'true'
        env:
          KEY: ${{ secrets.RELEASE_SSH_KEY }}
        run: |
          [ -n "$KEY" ] && exit 0
          next=$(uvx --from python-semantic-release@9.21.2 semantic-release version --print 2>/dev/null | tail -1)
          current=$(sed -nE 's/^__version__ = "(.*)"$/\1/p' src/endstate/__init__.py)
          if [ "$next" = "$current" ]; then
            echo "::notice::no release due ($current), so no push to main and no key needed"
            exit 0
          fi
          echo "::error::$current -> $next is due, but RELEASE_SSH_KEY is unset. The main ruleset blocks direct pushes; the release needs a write-enabled deploy key to bypass it. See CONTRIBUTING.md."
          exit 1

      - uses: python-semantic-release/python-semantic-release@v9.21.2
        if: steps.guard.outputs.fresh == 'true'
        id: release
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: version
    # Two ways in: a bump just happened, or a tag was named by hand.
    if: >
      always() &&
      needs.version.result != 'failure' &&
      needs.version.result != 'cancelled' &&
      (needs.version.outputs.released == 'true' || inputs.tag != '')
    runs-on: ubuntu-latest
    # Add a required reviewer to this environment to turn the publish into a
    # manual gate without changing any of this.
    environment: pypi
    permissions:
      id-token: write # PyPI Trusted Publishing — no API tokens anywhere
    steps:
      - uses: actions/checkout@v5
        with:
          # The tag is the source of truth for what ships. Building from it
          # rather than from the branch means what lands on PyPI is exactly what
          # that tag contains.
          ref: ${{ needs.version.outputs.tag || inputs.tag }}

      - uses: astral-sh/setup-uv@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - run: uv build

      - name: Check the built version matches the tag
        env:
          TAG: ${{ needs.version.outputs.tag || inputs.tag }}
        run: |
          built=$(ls dist/*.whl | sed -E 's/.*endstate-([^-]+)-.*/\1/')
          expected="${TAG#v}"
          if [ "$built" != "$expected" ]; then
            echo "::error::tag $TAG builds version $built, not $expected"
            exit 1
          fi
          echo "publishing $built from $TAG"

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A PyPI version can never be re-uploaded. On a re-run, skip what is
          # already there rather than failing the job on a conflict.
          skip-existing: true
