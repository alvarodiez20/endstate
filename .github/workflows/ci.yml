name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every version python.org still supports. 3.10 is security-only
        # until October 2026 and comes out of this list when it goes EOL.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          # setup-uv fetches uv from the GitHub API. Anonymous requests share a
          # per-IP limit with every other runner on that host, so without a
          # token this step fails intermittently on a green tree.
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov=endstate --cov-report=term-missing --cov-fail-under=85
