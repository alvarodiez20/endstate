name: version

# Versioning runs only after CI has gone green on main. Tagging a commit whose
# tests never passed would make the tag a worse signal than the commit it points
# at, so this waits for the run rather than racing it.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: version
  cancel-in-progress: false

jobs:
  release:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the commit, the tag and the GitHub Release
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: the bump is computed from every commit since the last
          # tag, and a shallow clone silently sees none of them.
          fetch-depth: 0
          ref: main

      # Reads [tool.semantic_release] in pyproject.toml. Conventional Commits
      # decide the bump; a push of only docs or chore commits produces nothing,
      # which is the intended outcome rather than a failure.
      #
      # Publishing to PyPI is deliberately NOT wired here — see release.yml.
      - uses: python-semantic-release/python-semantic-release@v9.21.2
        id: release
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Summarise
        run: |
          if [ "${{ steps.release.outputs.released }}" = "true" ]; then
            echo "Released \`${{ steps.release.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Publish it to PyPI with the \`release\` workflow." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No release: nothing since the last tag warranted a version bump." >> "$GITHUB_STEP_SUMMARY"
          fi
